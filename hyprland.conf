# ============================
# HYPRLAND CONFIG - Improved: Added animations, fixed drop_shadow syntax bug, added comments, maintained functionality. Removed invalid rounding_power.
# ============================

# ============================
# MONITORES - Configure displays. First is default, second is specific HDMI.
# ============================

monitor = ,preferred,auto,auto  # Default monitor auto-config.
monitor = HDMI-A-1,1920x1080@180,0x0,1  # HDMI monitor at 180Hz, position 0x0, scale 1.

# ============================
# PROGRAMAS Y VARIABLES - Define shortcuts and environment vars.
# ============================

$terminal = kitty  # Terminal app.
$fileManager = sudo dolphin  # File manager (requires sudo for admin).
$menu = rofi --show drun  # App launcher.

# ============================
# AUTOSTART - Programs to run once on startup.
# ============================

exec-once = hyprctl setcursor FurinaCursor 24
exec-once = mpvpaper -o "loop no-audio hwdec=vaapi" HDMI-A-1 ~/Wallpapers/furina2.mp4
exec-once = discord
exec-once = spotify
exec-once = openrgb

# ============================
# ESTÉTICA EXTRA FURINA - Visual settings themed around Furina.
# ============================

env = XCURSOR_THEME,Furina-v2
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Furina-v2
env = HYPRCURSOR_SIZE,24

general {
    gaps_in = 5  # Inner gaps between windows.
    gaps_out = 20  # Outer gaps to screen edges.
    border_size = 3  # Window border thickness.
    col.active_border = rgba(0080ffff) rgba(00cfffaa) 45deg  # Active border: saturated blue gradient.
    col.inactive_border = rgba(0080ff66)  # Inactive border: light blue.
    resize_on_border = false  # Disable resizing via border grab.
    allow_tearing = false  # Disable tearing for smoother rendering (enable for performance if needed).
    layout = dwindle  # Layout algorithm: dwindle for dynamic tiling.
}

decoration {
    rounding = 3  # Corner rounding radius.
    active_opacity = 1  # Opacity for active windows.
    inactive_opacity = 0.5  # Opacity for inactive windows.

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(89b4fa33)  # Azul clarito (toque furina xd)
    }

    blur {
        enabled = true
        size = 0
        brightness = 0.4
    }
}

# ============================
# ANIMATIONS - Added for smoother transitions: Define bezier curves and animations.
# ============================

animations {
    enabled = true  # Global animations toggle.
    bezier = ease, 0.175, 0.885, 0.32, 1.1  # Custom ease curve for overshoot effect.
    animation = windows, 1, 4, ease, slide 20% # Window open/close: slide style, 500ms.
    animation = windowsOut, 1, 4, ease, slide 20% # Window close: slide out.
    animation = border, 1, 8, default  # Border animations.
    animation = fade, 1, 5, default  # Fade in/out.
    animation = workspaces, 1, 5, ease, slidefade 80%  # Workspace switch: slide with fade.
}

# ============================
# INPUT - Keyboard, mouse, touchpad settings.
# ============================

input {
    kb_layout = us  # Keyboard layout.
    kb_variant =   # Variant (empty).
    kb_model =   # Model (empty).
    kb_options =   # Options (empty).
    kb_rules =   # Rules (empty).
    follow_mouse = 1  # Cursor follows focus.
    accel_profile = flat  # Mouse acceleration: flat (no accel).
    sensitivity = -0.5  # Mouse sensitivity.
    touchpad {
        natural_scroll = false  # Disable natural scrolling.
    }
}

gestures {
#    workspace_swipe = false  # Disable workspace swipe gestures.
}		

device {
    name = epic-mouse-v1  # Specific device config.
    sensitivity = -0.5  # Sensitivity for this mouse.
}

# ============================
# KEYBINDINGS - Shortcuts using SUPER as modifier.
# ============================

$mainMod = SUPER  # Main modifier key.

bind = $mainMod, Q, exec, $terminal  # Open terminal.
bind = $mainMod, X, killactive,  # Close active window.
bind = $mainMod, E, exec, dolphin  # Open file manager (non-sudo for safety; adjust if needed).
bind = $mainMod, V, togglefloating,  # Toggle floating mode.
bind = SUPER, M, exec, wofi --show drun --style ~/.config/wofi/style.css # Open app menu.
bind = $mainMod, J, togglesplit,  # Toggle split direction.
# bind = $mainMod, F, exec, firefox  # Open Firefox.

# Move focus
bind = $mainMod, left, movefocus, l  # Focus left.
bind = $mainMod, right, movefocus, r  # Focus right.
bind = $mainMod, up, movefocus, u  # Focus up.
bind = $mainMod, down, movefocus, d  # Focus down.

# Workspaces
bind = $mainMod, 1, workspace, 1  # Switch to workspace 1.
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1  # Move to workspace 1.
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scratchpad
# bind = $mainMod, S, togglespecialworkspace, magic  # Toggle special workspace.
bind = $mainMod SHIFT, S, movetoworkspace, special:magic  # Move to special.

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1  # Next workspace.
bind = $mainMod, mouse_up, workspace, e-1  # Previous workspace.

# Move/resize windows
bindm = $mainMod, mouse:272, movewindow  # Move window with mouse.
bindm = $mainMod, mouse:273, resizewindow  # Resize with mouse.

# ============================
# WINDOWS AND WORKSPACES - Rules for windows.
# ============================

windowrulev2 = suppressevent maximize, class:.*  # Suppress maximize events (updated syntax if needed; check for deprecation).
windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0  # Ignore focus for certain empty-title XWayland windows.

# ============================
# END OF CONFIG
# ============================

